specVersion: 1.2.0
description: Hunch VPM — vested and classic parimutuel markets on Arc, side by side.
schema:
  file: ./schema.graphql

# This committed manifest is the arc-testnet one. Its addresses and startBlocks are
# written by `pnpm wire:testnet` from deployments/arc-testnet.json, together with
# networks.json — never by hand. Deploy other networks through tools/with-network.mjs,
# which swaps that network in and restores this file afterwards.
#
# The settlers are singletons — one contract, many markets — so they are static data
# sources rather than templates spawned by MarketFactory. A template cannot be used
# here: MarketOpened is emitted after MarketCreated in the same transaction, and a
# template only begins indexing at the following block, so every seed entry would be
# missed.
dataSources:
  - kind: ethereum
    name: VestedParimutuel
    network: arc-testnet
    source:
      address: "0xC743940C75619f65F6178b7e49c0C3A0bE012Eec"
      abi: VestedParimutuel
      startBlock: 61840931
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/vested.ts
      entities:
        - Protocol
        - Market
        - Book
        - Vintage
        - Position
        - Claim
        - Agent
        - MarketDayStat
      abis:
        - name: VestedParimutuel
          file: ./abis/VestedParimutuel.json
      eventHandlers:
        - event: MarketCreated(indexed uint256,indexed address,uint8,uint256,uint64)
          handler: handleMarketCreated
        - event: Entered(indexed uint256,indexed uint256,indexed address,uint8,uint256,uint64)
          handler: handleEntered
        - event: VintageFinalized(indexed uint256,indexed uint64,uint256)
          handler: handleVintageFinalized
        - event: Resolved(indexed uint256,uint8)
          handler: handleResolved
        - event: Voided(indexed uint256)
          handler: handleVoided
        - event: Claimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleClaimed
        - event: ResidueClaimed(indexed uint256,indexed address,uint256)
          handler: handleResidueClaimed
        - event: PositionTransferred(indexed uint256,indexed address,indexed address)
          handler: handlePositionTransferred

  - kind: ethereum
    name: ClassicParimutuel
    network: arc-testnet
    source:
      address: "0x21603b2176aB8495A81fF3B3bE853C64f3860D57"
      abi: ClassicParimutuel
      startBlock: 61840931
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/classic.ts
      entities:
        - Protocol
        - Market
        - Book
        - Position
        - Claim
        - Agent
        - MarketDayStat
      abis:
        - name: ClassicParimutuel
          file: ./abis/ClassicParimutuel.json
      eventHandlers:
        - event: MarketCreated(indexed uint256,indexed address,uint8,uint256,uint64)
          handler: handleMarketCreated
        - event: Entered(indexed uint256,indexed uint256,indexed address,uint8,uint256)
          handler: handleEntered
        - event: Resolved(indexed uint256,uint8)
          handler: handleResolved
        - event: Voided(indexed uint256)
          handler: handleVoided
        - event: Claimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleClaimed
        - event: ResidueClaimed(indexed uint256,indexed address,uint256)
          handler: handleResidueClaimed
        - event: PositionTransferred(indexed uint256,indexed address,indexed address)
          handler: handlePositionTransferred

  - kind: ethereum
    name: FeedResolver
    network: arc-testnet
    source:
      address: "0xd9Fde9112a5dE78075fae334D8A9a67fDcAee3f3"
      abi: FeedResolver
      startBlock: 61840931
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/feed-resolver.ts
      entities:
        - Market
        - SpecLink
      abis:
        - name: FeedResolver
          file: ./abis/FeedResolver.json
      eventHandlers:
        - event: SpecRegistered(indexed bytes32,indexed address,indexed uint256,address,bytes32,int256,uint8,uint64,uint64)
          handler: handleSpecRegistered
        - event: Resolved(indexed bytes32,uint256,uint8,int256,uint256)
          handler: handleFeedResolved
        - event: VoidedStale(indexed bytes32,uint256)
          handler: handleVoidedStale

  - kind: ethereum
    name: MarketFactory
    network: arc-testnet
    source:
      address: "0x0380C6FC136AE64432558e407706a5C7E7652f07"
      abi: MarketFactory
      startBlock: 61840932
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities:
        - Market
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
      eventHandlers:
        - event: MarketOpened(indexed uint256,indexed address,indexed bytes32,address,uint256[],uint256,uint64)
          handler: handleMarketOpened
