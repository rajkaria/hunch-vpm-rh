[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Robinhood Chain (Arbitrum Orbit, ArbOS 61) runs Cancun opcodes; BLOBBASEFEE reverts there.
evm_version = "cancun"
# the vector replay is one long test: lift the per-test gas and memory ceilings
gas_limit = "18446744073709551615"
memory_limit = 268435456
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  { access = "write", path = "./GAS.md" },
]
gas_reports = ["VestedParimutuel", "NaiveVestedParimutuel"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
# A keyed provider (Alchemy / QuickNode). The public RPC keeps only ~10 minutes of
# historical state, so forks pinned to an older block fail on it.
robinhood = "${RH_RPC_URL}"

# Blockscout needs no API key: verification flags go on the command line
# (--verifier blockscout --verifier-url https://robinhoodchain.blockscout.com/api/),
# with Sourcify as the fallback. See docs/OPERATOR.md.

# The vendored reference implementation and its suite must stay byte-for-byte
# identical to what was published with the paper — the formatter never touches them.
[fmt]
ignore = [
  "src/reference/VestedParimutuel.sol",
  "src/reference/NaiveVestedParimutuel.sol",
  "src/mocks/MockERC20.sol",
  "test/Vectors.t.sol",
  "test/Mechanism.t.sol",
  "test/Gas.t.sol",
]
