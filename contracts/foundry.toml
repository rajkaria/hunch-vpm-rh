[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Robinhood Chain (Arbitrum Orbit, ArbOS 61) runs Cancun opcodes; BLOBBASEFEE reverts there.
evm_version = "cancun"
# the vector replay is one long test: lift the per-test gas and memory ceilings
gas_limit = "18446744073709551615"
memory_limit = 268435456
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  # GAS.md: HunchGas.t.sol (the product contracts); GAS-REFERENCE.md: the vendored Gas.t.sol
  { access = "write", path = "./GAS.md" },
  { access = "write", path = "./GAS-REFERENCE.md" },
  # worked-example.json + mechanics-vectors.json, imported by the web and the TS client
  { access = "read-write", path = "./fixtures" },
]
gas_reports = ["HunchVPM", "StockRoundResolver", "HunchMarketFactory", "VestedParimutuel", "NaiveVestedParimutuel"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

# CI (FOUNDRY_PROFILE=ci): deeper fuzzing, the spec's 256 x 128 invariant campaign, and the
# differential fuzz at 10,000 sequences (set inline in test/Differential.t.sol).
[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = false

[rpc_endpoints]
# A keyed provider (Alchemy / QuickNode). The public RPC keeps only ~10 minutes of
# historical state, so forks pinned to an older block fail on it.
robinhood = "${RH_RPC_URL}"

# Blockscout needs no API key: verification flags go on the command line
# (--verifier blockscout --verifier-url https://robinhoodchain.blockscout.com/api/),
# with Sourcify as the fallback. See docs/OPERATOR.md.

# The vendored reference implementation and its suite must stay byte-for-byte
# identical to what was published with the paper — the formatter never touches them.
# HunchVPM is the reference plus tagged diffs (DIFF.md); formatting it would rewrite every
# aligned comment of the reference and bury the seven real diffs, so it is ignored too.
[fmt]
ignore = [
  "src/reference/VestedParimutuel.sol",
  "src/reference/NaiveVestedParimutuel.sol",
  "src/mocks/MockERC20.sol",
  "src/HunchVPM.sol",
  "test/Vectors.t.sol",
  "test/Mechanism.t.sol",
  "test/Gas.t.sol",
]

# forge-lint runs on build. The vendored files keep the paper's style, and HunchVPM inherits it
# line for line (see [fmt] above), so they are not linted; neither are the tests. The new
# production contracts (StockRoundResolver, HunchMarketFactory, interfaces, mocks) are.
[lint]
# asm-keccak256 would trade readable keccak256(abi.encode(...)) for assembly to save a few gas.
exclude_lints = ["asm-keccak256"]
ignore = [
  "src/reference/*.sol",
  "src/mocks/MockERC20.sol",
  "src/ClassicParimutuel.sol",
  "src/HunchVPM.sol",
  "test/*.sol",
  "test/utils/*.sol",
]
