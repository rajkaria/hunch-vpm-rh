name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }   # contracts/lib/forge-std is a pinned submodule
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }
      # No `version:` here on purpose: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm verify (forge build, forge test, drift checks, typecheck, vitest, next build)
        run: pnpm verify
        env:
          FOUNDRY_PROFILE: ci
          # Fork suites run only when a keyed RPC is configured as a repository secret.
          RH_RPC_URL: ${{ secrets.RH_RPC_URL }}
