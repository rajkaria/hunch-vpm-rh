name: keeper

# Settles frozen markets on every Arc that has a deployment. One pass per network per run, as the
# keeper is designed to run.
#
# The spec ids come from deployments/arc-<network>.json, so opening a market and committing its
# entry is all it takes to put it under the keeper. A network with no deployments file is skipped:
# absence means not deployed. Without that network's key secret this is a dry run and only reports;
# with it, it sends `resolve` for every spec whose feed is fresh. It never voids — `--allow-void` is
# an operator's decision, not a schedule's.
#
#   network  RPC                                              key (repository secret)
#   testnet  https://rpc.testnet.arc.io                       KEEPER_PRIVATE_KEY
#   mainnet  repository VARIABLE ARC_MAINNET_RPC_URL          KEEPER_PRIVATE_KEY_MAINNET
#
# Mainnet's RPC is a variable with no default: a guessed endpoint is worse than a red run. Once
# deployments/arc-mainnet.json exists, a missing variable, or an endpoint answering some other
# chain id, fails the mainnet job loudly every ten minutes until it is fixed.
#
# GitHub runs schedules on the default branch only, at best every five minutes and sometimes late.
# Lateness costs nothing: the book froze at `resolutionTime` whenever `resolve` lands.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settle:
    name: settle (${{ matrix.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: testnet
            chain_id: "5042002"
            key_secret: KEEPER_PRIVATE_KEY
          - network: mainnet
            chain_id: "5042"
            key_secret: KEEPER_PRIVATE_KEY_MAINNET
    concurrency:
      group: keeper-arc-${{ matrix.network }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: deployment
        id: deployment
        env:
          NETWORK: ${{ matrix.network }}
          WANT_CHAIN: ${{ matrix.chain_id }}
          FILE: deployments/arc-${{ matrix.network }}.json
          MAINNET_RPC: ${{ vars.ARC_MAINNET_RPC_URL }}
        run: |
          if [ ! -f "$FILE" ]; then
            echo "::notice::$FILE does not exist: Arc $NETWORK is not deployed, nothing to keep"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NETWORK" = "mainnet" ]; then RPC="$MAINNET_RPC"; else RPC="https://rpc.testnet.arc.io"; fi
          if [ -z "$RPC" ]; then
            echo "::error::$FILE exists but the ARC_MAINNET_RPC_URL repository variable is not set"
            exit 1
          fi

          FILE_CHAIN="$(jq -r .chainId "$FILE")"
          if [ "$FILE_CHAIN" != "$WANT_CHAIN" ]; then
            echo "::error::$FILE says chainId $FILE_CHAIN; Arc $NETWORK is $WANT_CHAIN"
            exit 1
          fi
          RPC_CHAIN_HEX="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$RPC" | jq -r '.result // "0x0"')"
          if [ "$((RPC_CHAIN_HEX))" != "$WANT_CHAIN" ]; then
            echo "::error::the $NETWORK RPC answers chain $((RPC_CHAIN_HEX)), not Arc $NETWORK ($WANT_CHAIN)"
            exit 1
          fi

          IDS="$(jq -r '[.markets[]?.specId] | join(",")' "$FILE")"
          if [ -z "$IDS" ]; then
            echo "::notice::$FILE lists no markets, nothing to keep"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "run=true"
            echo "rpc=$RPC"
            echo "resolver=$(jq -r .feedResolver "$FILE")"
            echo "ids=$IDS"
          } >> "$GITHUB_OUTPUT"

      - if: steps.deployment.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.deployment.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.deployment.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.deployment.outputs.run == 'true'
        run: pnpm --filter @hunch-vpm/agent... build

      - name: keeper pass
        if: steps.deployment.outputs.run == 'true'
        env:
          NETWORK: ${{ matrix.network }}
          ARC_RPC_URL: ${{ steps.deployment.outputs.rpc }}
          ARC_CHAIN_ID: ${{ matrix.chain_id }}
          FEED_RESOLVER: ${{ steps.deployment.outputs.resolver }}
          KEEPER_SPEC_IDS: ${{ steps.deployment.outputs.ids }}
          KEEPER_PRIVATE_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -n "$KEEPER_PRIVATE_KEY" ]; then
            node agent/dist/keeper/main.js --live
          else
            echo "::notice::no keeper key for Arc $NETWORK: dry run, nothing will be sent"
            node agent/dist/keeper/main.js
          fi
